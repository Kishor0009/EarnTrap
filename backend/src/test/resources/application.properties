# Test Application Properties
spring.application.name=backend-test

# Test Database Configuration (In-Memory H2 with MySQL compatibility)
spring.datasource.url=jdbc:h2:mem:earntrap_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# CORS Configuration
cors.allowed-origins=http://localhost:5173,https://earn-trap.vercel.app

# JWT Signing Secret
jwt.secret=EarnTrapSuperSecretKeyForJwtAuthentication2026VerySecureKey

# Payment Provider Configuration
earntrap.payment.provider=SANDBOX
earntrap.payment.sandbox.enabled=true
earntrap.payment.key-id=
earntrap.payment.key-secret=
earntrap.payment.webhook-secret=
