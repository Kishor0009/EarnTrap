spring.application.name=backend

# Server Configuration (Render dynamically assigns PORT; default to 8080 for local dev)
server.port=${PORT:8080}

# Database Configuration (TiDB Cloud TLS preserved; credentials supplied via environment variables)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/earntrap?useSSL=true&requireSSL=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Configuration (Vercel frontend origin configured via environment variable)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://earn-trap.vercel.app}

# JWT Signing Secret (Production secret configured via environment variable)
jwt.secret=${JWT_SECRET:EarnTrapSuperSecretKeyForJwtAuthentication2026VerySecureKey}

# Logging
logging.level.org.springframework.security=TRACE
logging.level.com.earntrap.backend.security=DEBUG

# Payment Provider Configuration (Sandbox mode enabled by default)
earntrap.payment.provider=${PAYMENT_PROVIDER:SANDBOX}
earntrap.payment.sandbox.enabled=${PAYMENT_SANDBOX_ENABLED:true}
earntrap.payment.key-id=${PAYMENT_KEY_ID:}
earntrap.payment.key-secret=${PAYMENT_KEY_SECRET:}
earntrap.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}